name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          mkdir -p dist/UsdtRubWidget
          cp UsdtRubWidget.ps1 Start-Widget.vbs README.md README.ru.md dist/UsdtRubWidget/
          cd dist && zip -r "../UsdtRubWidget-${VERSION}.zip" UsdtRubWidget

      - name: Publish release
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > notes.md
          gh release create "${VERSION}" "UsdtRubWidget-${VERSION}.zip" \
            --target "${GITHUB_SHA}" --title "${VERSION}" --notes-file notes.md
