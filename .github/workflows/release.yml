name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          mkdir -p dist/UsdtRubWidget
          cp UsdtRubWidget.ps1 Start-Widget.vbs README.md README.ru.md dist/UsdtRubWidget/
          cd dist && zip -r "../UsdtRubWidget-${GITHUB_REF_NAME}.zip" UsdtRubWidget

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" .github/release-notes.md > notes.md
          gh release create "${GITHUB_REF_NAME}" "UsdtRubWidget-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" --notes-file notes.md
